License: UNLICENSED
ShortDescription: Live world clocks for the PowerToys Command Palette Dock.
Description: A PowerToys Command Palette extension that adds one Dock band with up to five live clocks. Each city is chosen in the extension settings (defaults are Seattle, London, and Tokyo). Times use the Windows regional short-time format, update at the start of each minute, and daylight saving is handled by Windows time-zone data. Selecting a clock copies its current local date and time. Requires PowerToys with Command Palette Dock support and the Command Palette Extension SDK 0.11 or later.
ReleaseNotes: Initial package (self-signed test build).
